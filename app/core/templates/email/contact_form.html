<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Form Submission - Lenis</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;padding:24px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background-color:#ffffff;border-radius:8px;border:1px solid #e4e4e7;overflow:hidden;">

          <!-- Header -->
          <tr>
            <td style="background-color:#09090b;padding:24px 16px;">
              <p style="margin:0;font-size:20px;font-weight:700;color:#ffffff;letter-spacing:-0.3px;">Lenis</p>
              <p style="margin:4px 0 0;font-size:12px;color:#a1a1aa;letter-spacing:0.5px;text-transform:uppercase;">Contact Form Submission</p>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:28px 16px;">
              <!-- Badge -->
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 20px;">
                <tr>
                  <td style="background-color:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;padding:6px 12px;">
                    <p style="margin:0;font-size:13px;font-weight:600;color:#1d4ed8;">&#9993;&#65039;&nbsp; New Contact Form Submission</p>
                  </td>
                </tr>
              </table>

              <h1 style="margin:0 0 8px;font-size:22px;font-weight:600;color:#09090b;line-height:1.3;">New message from {{ sender_name }}</h1>
              <p style="margin:0 0 24px;font-size:15px;color:#52525b;line-height:1.6;">
                A visitor submitted the Lenis contact form. Details below.
              </p>

              <!-- Sender Details -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;font-size:14px;margin:0 0 24px;">
                <tr style="border-bottom:1px solid #f4f4f5;">
                  <td style="padding:10px 0;color:#71717a;">Name</td>
                  <td style="padding:10px 0;color:#09090b;text-align:right;font-weight:500;">{{ sender_name }}</td>
                </tr>
                <tr>
                  <td style="padding:10px 0;color:#71717a;">Email</td>
                  <td style="padding:10px 0;color:#09090b;text-align:right;">
                    <a href="mailto:{{ sender_email }}" style="color:#09090b;font-weight:500;">{{ sender_email }}</a>
                  </td>
                </tr>
              </table>

              <!-- Message Box -->
              <p style="margin:0 0 8px;font-size:13px;font-weight:600;color:#71717a;text-transform:uppercase;letter-spacing:0.5px;">Message</p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#fafafa;border:1px solid #e4e4e7;border-radius:6px;">
                <tr>
                  <td style="padding:16px;font-size:14px;color:#09090b;line-height:1.7;white-space:pre-wrap;">{{ message }}</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:16px 16px;border-top:1px solid #e4e4e7;">
              <p style="margin:0;font-size:12px;color:#a1a1aa;line-height:1.5;">
                Lenis &bull; Contact Form &bull; Reply directly to {{ sender_email }}
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
