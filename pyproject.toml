[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "lenis"
version = "0.1.0"
description = "Non-custodial Web3 Financial Infrastructure SaaS"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi==0.115.14",
    "uvicorn[standard]==0.34.3",
    # Database
    "sqlalchemy==2.0.41",
    "alembic==1.14.1",
    "aiosqlite==0.20.0",
    "asyncpg==0.30.0",
    # Auth and security
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.2.1",
    "python-jose[cryptography]==3.5.0",
    "cryptography==45.0.3",
    # Cache and queue
    "redis==5.2.1",
    "celery[redis]==5.4.0",
    # Settings
    "pydantic-settings==2.7.1",
    "pydantic==2.10.6",
    # HTTP client
    "httpx==0.28.1",
    # Email
    "aiosmtplib==3.0.2",
    "jinja2==3.1.5",
    # Utilities
    "python-multipart==0.0.20",
    # File MIME detection (server-side, requires libmagic system library)
    "python-magic==0.4.27",
    # Windows: ships the libmagic DLL (no-op on Linux/macOS where libmagic is installed via apt/brew)
    "python-magic-bin==0.4.14",
    # QR code generation (Pillow is the image backend)
    "qrcode[pil]==8.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==8.3.4",
    "pytest-asyncio==0.25.3",
    "pytest-cov==6.0.0",
    "hypothesis==6.122.3",
    "httpx==0.28.1",
    # Code quality
    "ruff==0.8.6",
    "mypy==1.14.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
