# =============================================================================
# Lenis Platform — Production Docker Compose
# =============================================================================
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   - Copy .env.example to .env and fill in all required values.
#   - Generate an RSA key-pair:  python scripts/generate_keypair.py
#   - Generate WEBHOOK_ENCRYPTION_KEY:
#       python -c "import os, base64; print(base64.b64encode(os.urandom(32)).decode())"
#   - Obtain a TLS certificate and place nginx/prod.conf before starting nginx.
# =============================================================================

services:

  # --------------------------------------------------------------------------
  # FastAPI application
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --------------------------------------------------------------------------
  # Celery worker — processes background tasks
  # --------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.core.celery_app worker --loglevel=warning
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis

  # --------------------------------------------------------------------------
  # Celery beat — periodic task scheduler
  # --------------------------------------------------------------------------
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.core.celery_app beat --loglevel=warning
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis

  # --------------------------------------------------------------------------
  # Redis — broker, result backend, rate-limit state, cache
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # --------------------------------------------------------------------------
  # PostgreSQL — primary relational database
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data

  # --------------------------------------------------------------------------
  # Nginx — TLS termination and reverse proxy
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

# =============================================================================
# Named volumes
# =============================================================================
volumes:
  pg_data:
  redis_data:
