[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lenis-python"
version = "0.1.0"
description = "Official Python SDK for the Lenis non-custodial crypto payment platform."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["lenis", "crypto", "payments", "web3", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27,<1",
    "typing_extensions>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "mypy>=1.9",
]

[project.urls]
Homepage = "https://lenis.io"
Documentation = "https://lenis.io/docs"
Repository = "https://github.com/lenis/lenis-python"
"Bug Tracker" = "https://github.com/lenis/lenis-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["lenis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.10"
